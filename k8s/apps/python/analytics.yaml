apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: raas
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: raas/analytics-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
          name: http
        env:
        - name: PORT
          value: "8004"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: raas-config
              key: ANALYTICS_DB_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: raas-config
              key: KAFKA_BROKER
        - name: KAFKA_CLIENT_ID
          value: analytics-service
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: raas
  labels:
    app: analytics-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8004
    protocol: TCP
    name: http
    nodePort: 30023
  selector:
    app: analytics-service
