apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  namespace: raas
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: raas/notification-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: PORT
          value: "8003"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: raas-config
              key: NOTIFICATION_DB_URL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: raas-config
              key: KAFKA_BROKER
        - name: KAFKA_CLIENT_ID
          value: notification-service
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: raas
  labels:
    app: notification-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8003
    protocol: TCP
    name: http
    nodePort: 30022
  selector:
    app: notification-service
