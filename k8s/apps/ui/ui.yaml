apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: raas
  labels:
    app: ui-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
        - name: ui-service
          image: raas/ui-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: raas
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 4000
      nodePort: 30080
  selector:
    app: ui-service
