apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: raas
data:
  default.conf: |
    # WebSocket upgrade for the admin tools.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The RaaS JWT cookie must not reach the admin tools.
    map $http_cookie $tool_cookie {
        default $http_cookie;
        "~^(?<pre>(?:.*?;\s*)?)raas_token=[^;]*;?\s*(?<post>.*)$" "$pre$post";
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for the Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # API Routing Configuration

        # Internal location to verify authentication against the user service
        location = /api/auth/verify {
            internal;
            rewrite ^/api/auth/verify$ /users/me break;
            proxy_pass http://user-service.raas.svc.cluster.local:80;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # 1. Listings Service
        location /api/listings {
            error_page 418 = @write_listings;
            recursive_error_pages on;

            if ($request_method != GET) {
                return 418;
            }

            rewrite ^/api/listings$ /listings break;
            proxy_pass http://listing-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @write_listings {
            auth_request /api/auth/verify;
            rewrite ^/api/listings$ /listings break;
            proxy_pass http://listing-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/listings/([a-zA-Z0-9]+)$ {
            set $listing_id $1;
            error_page 418 = @write_listing_id;
            recursive_error_pages on;

            if ($request_method != GET) {
                return 418;
            }

            rewrite ^/api/listings/([a-zA-Z0-9]+)$ /listings/$1 break;
            proxy_pass http://listing-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @write_listing_id {
            auth_request /api/auth/verify;
            rewrite ^/api/listings/([a-zA-Z0-9]+)$ /listings/$1 break;
            proxy_pass http://listing-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Listings Availability Service
        location /api/v1/listings/available {
            rewrite ^/api/v1/listings/available$ /v1/listings/available break;
            proxy_pass http://listing-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Bookings Service
        location /api/bookings {
            auth_request /api/auth/verify;
            rewrite ^/api/bookings$ /bookings break;
            proxy_pass http://booking-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/bookings/([a-zA-Z0-9\-]+)$ {
            auth_request /api/auth/verify;
            rewrite ^/api/bookings/([a-zA-Z0-9\-]+)$ /bookings/$1 break;
            proxy_pass http://booking-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. User Service
        location ~ ^/api/users/([a-zA-Z0-9\-]+)$ {
            rewrite ^/api/users/([a-zA-Z0-9\-]+)$ /users/$1 break;
            proxy_pass http://user-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Media Service
        location /api/media/upload {
            rewrite ^/api/media/upload$ /media/upload break;
            proxy_pass http://media-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Payment Service
        location ~ ^/api/payments/([a-zA-Z0-9\-]+)$ {
            set $upstream_payment "http://payment-service.raas.svc.cluster.local:80";
            proxy_pass $upstream_payment/payments/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/payments {
            rewrite ^/api/payments$ /payments break;
            proxy_pass http://payment-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/payments/swagger-ui/ {
            set $upstream_payment "http://payment-service.raas.svc.cluster.local:80";
            rewrite ^/api/payments/(.*)$ /$1 break;
            proxy_pass $upstream_payment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/payments;
        }

        location /api/payments/v3/api-docs {
            set $upstream_payment "http://payment-service.raas.svc.cluster.local:80";
            rewrite ^/api/payments/(.*)$ /$1 break;
            proxy_pass $upstream_payment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/payments;
        }

        # 7. Review Service

        location /api/reviews {
            proxy_pass http://review-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/reviews/swagger-ui/ {
            set $upstream_review "http://review-service.raas.svc.cluster.local:80";
            rewrite ^/api/reviews/(.*)$ /$1 break;
            proxy_pass $upstream_review;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/reviews;
        }

        location /api/reviews/v3/api-docs {
            set $upstream_review "http://review-service.raas.svc.cluster.local:80";
            rewrite ^/api/reviews/(.*)$ /$1 break;
            proxy_pass $upstream_review;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/reviews;
        }

        # 8. Favorites Service
        location /api/favorites {
            proxy_pass http://favorites-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 9. Analytics Service
        location ~ ^/api/analytics/host/([a-zA-Z0-9\-]+)$ {
            auth_request /api/auth/verify;
            rewrite ^/api/analytics/host/([a-zA-Z0-9\-]+)$ /analytics/host/$1 break;
            proxy_pass http://analytics-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/favorites/swagger-ui/ {
            set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:80";
            rewrite ^/api/favorites/(.*)$ /$1 break;
            proxy_pass $upstream_favorites;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/favorites;
        }

        location /api/favorites/v3/api-docs {
            set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:80";
            rewrite ^/api/favorites/(.*)$ /$1 break;
            proxy_pass $upstream_favorites;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/favorites;
        }

    # 9b. Media files: browser-reachable, same origin, works in any environment.
    location /media-files/ {
        rewrite ^/media-files/(.*)$ /raas-media-bucket/$1 break;
        proxy_pass http://minio.raas.svc.cluster.local:9000;
    }

        # Admin infra tools, served on the gateway origin and gated to role=admin (user-service /users/admin-check).
        # Upstreams are variables resolved at request time, so a missing tool Service cannot stop the gateway starting.
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;

        location = /api/auth/verify-admin {
            internal;
            rewrite ^/api/auth/verify-admin$ /users/admin-check break;
            proxy_pass http://user-service.raas.svc.cluster.local:80;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # Cookie only: tools send their own Authorization headers, which must not decide admin access.
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization "";
        }

        location = /admin/grafana { absolute_redirect off; return 302 /admin/grafana/; }
        location = /admin/minio   { absolute_redirect off; return 302 /admin/minio/; }
        location = /admin/adminer { absolute_redirect off; return 302 /admin/adminer/; }
        location = /admin/kafka   { absolute_redirect off; return 302 /admin/kafka/; }

        # Grafana keeps its prefix (serve_from_sub_path) and trusts X-WEBAUTH-USER, which is always overwritten here.
        location /admin/grafana/ {
            auth_request /api/auth/verify-admin;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            set $up_grafana http://grafana.raas.svc.cluster.local:3000;
            proxy_pass $up_grafana;
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $tool_cookie;
            proxy_set_header Authorization "";
            proxy_read_timeout 300s;
            proxy_buffering off;
            client_max_body_size 0;
        }

        location /admin/minio/ {
            auth_request /api/auth/verify-admin;
            set $up_minio http://minio-console.raas.svc.cluster.local:9001;
            rewrite ^/admin/minio/(.*)$ /$1 break;
            proxy_pass $up_minio;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $tool_cookie;
            proxy_set_header Authorization "";
            proxy_read_timeout 300s;
            proxy_buffering off;
            client_max_body_size 0;
        }

        location /admin/adminer/ {
            auth_request /api/auth/verify-admin;
            set $up_adminer http://adminer.raas.svc.cluster.local:8080;
            rewrite ^/admin/adminer/(.*)$ /$1 break;
            proxy_pass $up_adminer;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $tool_cookie;
            proxy_set_header Authorization "";
            proxy_read_timeout 300s;
            proxy_buffering off;
            client_max_body_size 0;
        }

        # Redpanda Console serves itself under /admin/kafka (basePath in its config), so the prefix is kept.
        location /admin/kafka/ {
            auth_request /api/auth/verify-admin;
            set $up_kafka http://redpanda-console.raas.svc.cluster.local:8080;
            proxy_pass $up_kafka;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $tool_cookie;
            proxy_set_header Authorization "";
            proxy_read_timeout 300s;
            proxy_buffering off;
            client_max_body_size 0;
        }

        # 10. UI Service Fallback
        location / {
            proxy_pass http://ui-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

