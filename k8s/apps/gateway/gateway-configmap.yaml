apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: raas
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        # Health check for the Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # API Routing Configuration

        # Internal location to verify authentication against the user service
        location = /api/auth/verify {
            internal;
            proxy_pass http://user-service.raas.svc.cluster.local:80/users/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # 1. Listings Service
        location /api/listings {
            error_page 418 = @write_listings;
            recursive_error_pages on;

            if ($request_method != GET) {
                return 418;
            }

            proxy_pass http://listing-service.raas.svc.cluster.local:80/listings$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @write_listings {
            auth_request /api/auth/verify;
            proxy_pass http://listing-service.raas.svc.cluster.local:80/listings$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/listings/([a-zA-Z0-9]+)$ {
            set $listing_id $1;
            error_page 418 = @write_listing_id;
            recursive_error_pages on;

            if ($request_method != GET) {
                return 418;
            }

            proxy_pass http://listing-service.raas.svc.cluster.local:80/listings/$listing_id$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @write_listing_id {
            auth_request /api/auth/verify;
            proxy_pass http://listing-service.raas.svc.cluster.local:80/listings/$listing_id$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Listings Availability Service
        location /api/v1/listings/available {
            proxy_pass http://listing-service.raas.svc.cluster.local:80/v1/listings/available$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Bookings Service
        location /api/bookings {
            auth_request /api/auth/verify;
            proxy_pass http://booking-service.raas.svc.cluster.local:80/bookings$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/bookings/([a-zA-Z0-9\-]+)$ {
            auth_request /api/auth/verify;
            proxy_pass http://booking-service.raas.svc.cluster.local:80/bookings/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. User Service
        location ~ ^/api/users/([a-zA-Z0-9\-]+)$ {
            proxy_pass http://user-service.raas.svc.cluster.local:80/users/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Media Service
        location /api/media/upload {
            proxy_pass http://media-service.raas.svc.cluster.local:80/media/upload$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Payment Service
        location /api/payments {
            proxy_pass http://payment-service.raas.svc.cluster.local:80/payments$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 7. Review Service
        location /api/reviews {
            proxy_pass http://review-service.raas.svc.cluster.local:80/reviews$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 8. Favorites Service
        location /api/favorites {
            proxy_pass http://favorites-service.raas.svc.cluster.local:80/favorites$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 9. Analytics Service
        location ~ ^/api/analytics/host/([a-zA-Z0-9\-]+)$ {
            auth_request /api/auth/verify;
            proxy_pass http://analytics-service.raas.svc.cluster.local:80/analytics/host/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 10. UI Service Fallback
        location / {
            proxy_pass http://ui-service.raas.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
