apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-deployment
  namespace: raas
  labels:
    app: media-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
        - name: media-service
          image: raas/media-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: raas-config
                  key: MONGODB_URL
            - name: AWS_REGION
              value: "us-east-1"
            - name: S3_BUCKET
              value: "raas-media-bucket"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: raas-config
                  key: KAFKA_BROKER
          volumeMounts:
            - name: env-volume
              mountPath: /root/.env
              subPath: .env
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: env-volume
          secret:
            secretName: media-env
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: raas
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30002
  selector:
    app: media-service
