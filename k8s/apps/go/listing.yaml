apiVersion: apps/v1
kind: Deployment
metadata:
  name: listing-deployment
  namespace: raas
  labels:
    app: listing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listing-service
  template:
    metadata:
      labels:
        app: listing-service
    spec:
      containers:
        - name: listing-service
          image: raas/listing-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: raas-config
                  key: MONGODB_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: raas-config
                  key: KAFKA_BROKER
---
apiVersion: v1
kind: Service
metadata:
  name: listing-service
  namespace: raas
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30001
  selector:
    app: listing-service
