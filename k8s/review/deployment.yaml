apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-deployment
  labels:
    app: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: raas/review-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: REVIEW_DB_URL
              value: "jdbc:postgresql://postgres:5432/review"
            - name: REVIEW_DB_USER
              value: "review"
            - name: REVIEW_DB_PASSWORD
              value: "review"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
