apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: raas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
  namespace: raas
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
  namespace: raas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: raas
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: raas
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/tmp/alloy
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          ports:
            - containerPort: 12345
          resources:
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
