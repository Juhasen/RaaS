apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: raas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: raas
spec:
  selector:
    app: adminer
  ports:
    - port: 8080
      targetPort: 8080
