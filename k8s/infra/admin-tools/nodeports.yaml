# NodePort Services for the tool UIs. They select pods of other manifests, so those files stay untouched.
apiVersion: v1
kind: Service
metadata:
  name: minio-console-nodeport
  namespace: raas
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: raas
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console-nodeport
  namespace: raas
spec:
  type: NodePort
  selector:
    app: redpanda-console-auth
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30808
