# Served under /admin/kafka/ behind the gateway, which keeps the prefix; Console strips it itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
  namespace: raas
data:
  config.yaml: |
    kafka:
      brokers: ["kafka:9092"]
    server:
      basePath: /admin/kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: raas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.3.0
          env:
            - name: CONFIG_FILEPATH
              value: /etc/console/config.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/console
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /admin/health
              port: 8080
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
---
# Console OSS has no login: ClusterIP only, reached through the gateway at /admin/kafka/ (admin only).
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: raas
spec:
  selector:
    app: redpanda-console
  ports:
    - port: 8080
      targetPort: 8080
