apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: raas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.3.0
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /admin/health
              port: 8080
---
# Console OSS has no login, so it is ClusterIP only and reached through the basic-auth proxy below.
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: raas
spec:
  selector:
    app: redpanda-console
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-auth-config
  namespace: raas
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        auth_basic "Redpanda Console";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        location / {
            proxy_pass http://redpanda-console:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console-auth
  namespace: raas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console-auth
  template:
    metadata:
      labels:
        app: redpanda-console-auth
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
          readinessProbe:
            tcpSocket:
              port: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: htpasswd
              mountPath: /etc/nginx/auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: redpanda-console-auth-config
        - name: htpasswd
          secret:
            secretName: redpanda-console-auth
