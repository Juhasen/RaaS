# Admin credentials come from Secret grafana-admin, created by scripts/admin-secrets.ps1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: raas
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          envFrom:
            - secretRef:
                name: grafana-admin
          env:
            # Served at /admin/grafana/ behind the gateway, which sets X-WEBAUTH-USER for admins only.
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/admin/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: X-WEBAUTH-USER
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: Admin
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: raas
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
