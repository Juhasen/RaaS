global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: java-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:80", "review-service:80", "favorites-service:80"]
  - job_name: go-services
    static_configs:
      - targets: ["listing-service:80", "media-service:80", "booking-service:80"]
  - job_name: python-services
    static_configs:
      - targets: ["user-service:80", "notification-service:80", "analytics-service:80"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
