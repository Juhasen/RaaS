@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop with blur -->
    <div class="fixed inset-0 bg-zinc-950/40 backdrop-blur-xs transition-opacity" (click)="onCancel()"></div>

    <!-- Modal Card -->
    <div class="bg-white border border-zinc-100 rounded-2xl max-w-sm w-full p-6 shadow-xl relative z-10 animate-in fade-in zoom-in-95 duration-150">
      <!-- Icon based on type -->
      <div class="mb-4 flex items-center justify-center w-12 h-12 rounded-full mx-auto"
           [class.bg-rose-50]="confirmType() === 'danger'"
           [class.text-rose-600]="confirmType() === 'danger'"
           [class.bg-indigo-50]="confirmType() === 'primary'"
           [class.text-indigo-600]="confirmType() === 'primary'"
           [class.bg-amber-50]="confirmType() === 'warning'"
           [class.text-amber-600]="confirmType() === 'warning'">
        @if (confirmType() === 'danger') {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
        } @else if (confirmType() === 'warning') {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
          </svg>
        }
      </div>

      <!-- Title -->
      <h3 class="text-lg font-bold text-zinc-900 text-center mb-2 leading-snug">{{ title() }}</h3>
      
      <!-- Message -->
      <p class="text-sm text-zinc-500 text-center leading-relaxed mb-6">{{ message() }}</p>

      <!-- Buttons -->
      <div class="flex items-center gap-3">
        <button type="button" (click)="onCancel()" 
                class="flex-1 py-2.5 px-4 bg-zinc-100 hover:bg-zinc-200 active:bg-zinc-300 text-zinc-700 text-sm font-semibold rounded-xl transition-colors cursor-pointer border border-zinc-200 focus:outline-none">
          {{ cancelText() }}
        </button>
        <button type="button" (click)="onConfirm()"
                class="flex-1 py-2.5 px-4 text-sm font-semibold rounded-xl transition-all cursor-pointer shadow-sm focus:outline-none"
                [class.bg-rose-600]="confirmType() === 'danger'"
                [class.hover:bg-rose-700]="confirmType() === 'danger'"
                [class.text-white]="confirmType() === 'danger'"
                [class.bg-indigo-600]="confirmType() === 'primary'"
                [class.hover:bg-indigo-700]="confirmType() === 'primary'"
                [class.text-white]="confirmType() === 'primary'"
                [class.bg-amber-600]="confirmType() === 'warning'"
                [class.hover:bg-amber-700]="confirmType() === 'warning'"
                [class.text-white]="confirmType() === 'warning'">
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
