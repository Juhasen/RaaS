<section class="max-w-xl mx-auto py-4">
  <div class="bg-white border border-zinc-100 rounded-2xl p-8 shadow-xs">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-zinc-900 tracking-tight">Create Listing</h2>
      <p class="text-sm text-zinc-500 mt-1">Provide space details, nightly rates, and upload media to list your property.</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-zinc-700 mb-1">Title</label>
        <input type="text" placeholder="e.g., Cozy Beachfront Cabin" class="w-full px-3 py-2 border border-zinc-200 rounded-lg text-sm placeholder:text-zinc-400 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200" disabled>
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-700 mb-1">Description</label>
        <textarea rows="3" placeholder="Describe the space features, beds, and location details..." class="w-full px-3 py-2 border border-zinc-200 rounded-lg text-sm placeholder:text-zinc-400 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200" disabled></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-zinc-700 mb-1">Price per day ($)</label>
          <input type="number" placeholder="100.0" class="w-full px-3 py-2 border border-zinc-200 rounded-lg text-sm placeholder:text-zinc-400 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200" disabled>
        </div>
        <div>
          <label class="block text-sm font-medium text-zinc-700 mb-1">Location ID</label>
          <input type="text" placeholder="e.g., NYC-12" class="w-full px-3 py-2 border border-zinc-200 rounded-lg text-sm placeholder:text-zinc-400 focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200" disabled>
        </div>
      </div>

      <div class="pt-4 border-t border-zinc-100 flex items-center justify-between">
        <span class="text-xs text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full font-medium">Input fields are currently read-only</span>
        <button class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium text-sm hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100 cursor-not-allowed opacity-50" disabled>
          Publish Listing
        </button>
      </div>
    </div>
  </div>
</section>
