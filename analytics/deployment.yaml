apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: default
  labels:
    app: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: raas/analytics-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8008
          name: http
        env:
        - name: PORT
          value: "8008"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: analytics-db-secret
              key: connection-string
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: KAFKA_CLIENT_ID
          value: analytics-service
        - name: MONGO_URL
          valueFrom:
            secretKeyRef:
              name: analytics-mongo-secret
              key: connection-string
        - name: MONGO_DB_NAME
          value: analytics_db
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: default
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8008
    protocol: TCP
    name: http
  selector:
    app: analytics-service
