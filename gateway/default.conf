server {
    listen 80;
    server_name localhost;

    # Health check for the Gateway
    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # API Routing Configuration

    # Internal location to verify authentication against the user service
    location = /api/auth/verify {
        internal;
        rewrite ^/api/auth/verify$ /users/me break;
        proxy_pass http://user-service.raas.svc.cluster.local:80;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # 1. Listings Service
    location /api/listings {
        error_page 418 = @write_listings;
        recursive_error_pages on;

        if ($request_method != GET) {
            return 418;
        }

        rewrite ^/api/listings$ /listings break;
        proxy_pass http://listing-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @write_listings {
        auth_request /api/auth/verify;
        rewrite ^/api/listings$ /listings break;
        proxy_pass http://listing-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/listings/([a-zA-Z0-9]+)$ {
        set $listing_id $1;
        error_page 418 = @write_listing_id;
        recursive_error_pages on;

        if ($request_method != GET) {
            return 418;
        }

        rewrite ^/api/listings/([a-zA-Z0-9]+)$ /listings/$1 break;
        proxy_pass http://listing-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @write_listing_id {
        auth_request /api/auth/verify;
        rewrite ^/api/listings/([a-zA-Z0-9]+)$ /listings/$1 break;
        proxy_pass http://listing-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Listings Availability Service
    location /api/v1/listings/available {
        rewrite ^/api/v1/listings/available$ /v1/listings/available break;
        proxy_pass http://listing-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Bookings Service
    location /api/bookings {
        auth_request /api/auth/verify;
        rewrite ^/api/bookings$ /bookings break;
        proxy_pass http://booking-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/bookings/([a-zA-Z0-9\-]+)$ {
        auth_request /api/auth/verify;
        rewrite ^/api/bookings/([a-zA-Z0-9\-]+)$ /bookings/$1 break;
        proxy_pass http://booking-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. User Service
    location ~ ^/api/users/([a-zA-Z0-9\-]+)$ {
        rewrite ^/api/users/([a-zA-Z0-9\-]+)$ /users/$1 break;
        proxy_pass http://user-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Media Service
    location /api/media/upload {
        rewrite ^/api/media/upload$ /media/upload break;
        proxy_pass http://media-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Payment Service
    location /api/payments {
        rewrite ^/api/payments$ /payments break;
        proxy_pass http://payment-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payment/swagger-ui {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_payment/swagger-ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payment/v3/api-docs {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_payment/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. Review Service
    location /api/reviews {
        rewrite ^/api/reviews$ /reviews break;
        proxy_pass http://review-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/review/swagger-ui {
        set $upstream_review "http://review-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_review/swagger-ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/review/v3/api-docs {
        set $upstream_review "http://review-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_review/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8. Favorites Service
    location /api/favorites {
        rewrite ^/api/favorites$ /favorites break;
        proxy_pass http://favorites-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/favorites/swagger-ui {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_favorites/swagger-ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/favorites/v3/api-docs {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_favorites/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8. Favorites Service
    location /api/favorites {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_favorites/favorites;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI for Java services

    # Favorites Service Swagger
    location /api/favorites/swagger-ui.html {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_favorites/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/favorites/v3/api-docs {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_favorites/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Payment Service Swagger
    location /api/payments/swagger-ui.html {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_payment/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/payments/v3/api-docs {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_payment/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Review Service Swagger
    location /api/reviews/swagger-ui.html {
        set $upstream_review "http://review-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_review/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/reviews/v3/api-docs {
        set $upstream_review "http://review-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_review/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Swagger UI for Java services

    # Favorites Service Swagger
    location /api/favorites/swagger-ui.html {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_favorites/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/favorites/v3/api-docs {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_favorites/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Payment Service Swagger
    location /api/payments/swagger-ui.html {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_payment/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/payments/v3/api-docs {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_payment/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Review Service Swagger
    location /api/reviews/swagger-ui.html {
        set $upstream_review "http://review-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_review/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/reviews/v3/api-docs {
        set $upstream_review "http://review-service.raas.svc.cluster.local:8080";
        proxy_pass $upstream_review/v3/api-docs;
        proxy_set_header Host $host;
    }

    # 9. Analytics Service
    location ~ ^/api/analytics/host/([a-zA-Z0-9\-]+)$ {
        auth_request /api/auth/verify;
        rewrite ^/api/analytics/host/([a-zA-Z0-9\-]+)$ /analytics/host/$1 break;
        proxy_pass http://analytics-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 10. UI Service Fallback
    location / {
        proxy_pass http://ui-service.raas.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
