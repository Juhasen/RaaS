server {
    listen 80;
    server_name localhost;

    # Kubernetes cluster DNS resolver (kube-dns)
    # Using variables in proxy_pass delays resolution until runtime, preventing
    # Nginx from failing on startup if a microservice is not yet fully running.
    resolver 10.96.0.10 valid=10s;

    # Health check for the Gateway
    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # API Routing Configuration

    # 1. Listings Service
    location /api/listings {
        set $upstream_listing "http://listing-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_listing/listings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/listings/([a-zA-Z0-9]+)$ {
        set $upstream_listing "http://listing-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_listing/listings/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Listings Availability Service
    location /api/v1/listings/available {
        set $upstream_listing "http://listing-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_listing/v1/listings/available;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Bookings Service
    location /api/bookings {
        set $upstream_booking "http://booking-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_booking/bookings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/bookings/([a-zA-Z0-9\-]+)$ {
        set $upstream_booking "http://booking-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_booking/bookings/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. User Service
    location ~ ^/api/users/([a-zA-Z0-9\-]+)$ {
        set $upstream_user "http://user-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_user/users/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Media Service
    location /api/media/upload {
        set $upstream_media "http://media-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_media/media/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Payment Service
    location /api/payments {
        set $upstream_payment "http://payment-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_payment/payments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. Review Service
    location /api/reviews {
        set $upstream_review "http://review-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_review/reviews;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8. Favorites Service
    location /api/favorites {
        set $upstream_favorites "http://favorites-service.raas.svc.cluster.local:80";
        proxy_pass $upstream_favorites/favorites;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
