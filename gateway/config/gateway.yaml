runtime:
  request_id_header: X-Request-Id
  protect_by_default: true
  timeouts:
    connect_ms: 5000
    read_ms: 15000
    write_ms: 15000
  proxy:
    preserve_host: true
    passthrough: true

mounts:
  config: /etc/gateway/config

auth:
  provider: jwt
  config_file: /etc/gateway/config/auth.yaml
  context_file: /etc/gateway/config/auth-context.yaml
  header_prefix: x-raas-
  jwks_cache_ttl_seconds: 300

ownership_preflight:
  enabled: true
  default_timeout_ms: 2000
  error_mapping: ownership_failed
  max_retries: 0
