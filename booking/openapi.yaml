openapi: 3.0.3
info:
  title: Booking Microservice API
  description: API for creating and managing bookings in RaaS (Rent-a-Space).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: /api
    description: Gateway proxied URL
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the booking service.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /bookings:
    post:
      summary: Create a booking
      description: Creates a new booking in PENDING status, checking for conflicts and acquiring distributed locks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Booking created successfully in PENDING status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Missing required fields or invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Booking conflicts with existing dates or distributed lock failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal database or connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List bookings
      description: Returns a list of bookings, optionally filtered by guest_id or listing_id.
      parameters:
        - name: guest_id
          in: query
          description: Filter bookings by guest UUID
          required: false
          schema:
            type: string
            format: uuid
        - name: listing_id
          in: query
          description: Filter bookings by listing hex ID
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '500':
          description: Database or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings/{id}:
    get:
      summary: Get a booking by ID
      description: Retrieves a single booking using its UUID.
      parameters:
        - name: id
          in: path
          description: The UUID of the booking
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a booking
      description: Updates status or details of a booking by ID.
      parameters:
        - name: id
          in: path
          description: The UUID of the booking to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateInput'
      responses:
        '200':
          description: Booking updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a booking
      description: Deletes an existing booking from the database.
      parameters:
        - name: id
          in: path
          description: The UUID of the booking to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Booking deleted successfully
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    BookingInput:
      type: object
      required:
        - listing_id
        - guest_id
        - start_date
        - end_date
        - total_price
      properties:
        listing_id:
          type: string
          example: 64a7f0d2b1e6c9f1a2b3c4d5
        guest_id:
          type: string
          format: uuid
          example: a4b1c2d3-e4f5-a6b7-c8d9-e0f1a2b3c4d5
        start_date:
          type: string
          format: date
          example: 2026-06-15
        end_date:
          type: string
          format: date
          example: 2026-06-20
        total_price:
          type: number
          format: double
          example: 600.0
    BookingUpdateInput:
      type: object
      properties:
        listing_id:
          type: string
          example: 64a7f0d2b1e6c9f1a2b3c4d5
        guest_id:
          type: string
          format: uuid
          example: a4b1c2d3-e4f5-a6b7-c8d9-e0f1a2b3c4d5
        start_date:
          type: string
          format: date
          example: 2026-06-15
        end_date:
          type: string
          format: date
          example: 2026-06-20
        total_price:
          type: number
          format: double
          example: 600.0
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED]
          example: CONFIRMED
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d9b1c2d3-e4f5-a6b7-c8d9-e0f1a2b3c4d5
        listing_id:
          type: string
          example: 64a7f0d2b1e6c9f1a2b3c4d5
        guest_id:
          type: string
          format: uuid
          example: a4b1c2d3-e4f5-a6b7-c8d9-e0f1a2b3c4d5
        start_date:
          type: string
          format: date
          example: 2026-06-15
        end_date:
          type: string
          format: date
          example: 2026-06-20
        total_price:
          type: number
          format: double
          example: 600.0
        status:
          type: string
          example: PENDING
        created_at:
          type: string
          format: date-time
          example: 2026-06-12T19:30:00Z
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: booking not found
