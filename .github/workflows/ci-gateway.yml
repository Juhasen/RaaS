name: CI gateway

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/ci-gateway.yml"
      - ".github/workflows/service.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/ci-gateway.yml"
      - ".github/workflows/service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/service.yml
    with:
      dir: gateway
      stack: none
