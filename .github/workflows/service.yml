# Reusable pipeline for one service: lint -> unit tests -> build image.
# The image is pushed to GHCR only for non-PR runs (push to main, manual run).
name: Service pipeline

on:
  workflow_call:
    inputs:
      dir:
        description: Service directory, also the image name
        required: true
        type: string
      stack:
        description: go | java | python | ui | none
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    if: inputs.stack != 'none'
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v7

      - if: inputs.stack == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum
      - if: inputs.stack == 'go'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files above need formatting"; exit 1; }
          go vet ./...

      - if: inputs.stack == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ inputs.dir }}/pom.xml
      - if: inputs.stack == 'java'
        run: mvn -B -ntp -q -DskipTests compile

      - if: inputs.stack == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Syntax errors, undefined names and similar real bugs only; no style rules.
      - if: inputs.stack == 'python'
        run: |
          pip install -q ruff
          ruff check --select E9,F63,F7,F82 .

      - if: inputs.stack == 'ui'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/package-lock.json
      - if: inputs.stack == 'ui'
        run: |
          npm ci
          npx tsc -p tsconfig.app.json --noEmit

  test:
    needs: lint
    runs-on: ubuntu-latest
    if: inputs.stack != 'none'
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v7

      - if: inputs.stack == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          cache-dependency-path: ${{ inputs.dir }}/go.sum
      - if: inputs.stack == 'go'
        run: go test ./...

      - if: inputs.stack == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ inputs.dir }}/pom.xml
      - if: inputs.stack == 'java'
        run: mvn -B -ntp test

      - if: inputs.stack == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ inputs.dir }}/requirements.txt
      # No Python tests exist yet; this starts running them as soon as test files are added.
      - if: inputs.stack == 'python'
        run: |
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pip install -r requirements.txt pytest
            pytest
          else
            echo "No tests found, skipping."
          fi

      - if: inputs.stack == 'ui'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/package-lock.json
      - if: inputs.stack == 'ui'
        run: |
          npm ci
          npm test -- --watch=false

  build:
    needs: [lint, test]
    # Run even when lint/test are skipped (stack: none), but never after a failure.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Tag = short sha of the last commit that touched this service's directory,
      # so unchanged services keep their tag and the deploy script can derive it.
      - id: tag
        run: echo "value=sha-$(git log -1 --format=%H -- '${{ inputs.dir }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.dir }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.dir }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.dir }}
          cache-to: type=gha,mode=max,scope=${{ inputs.dir }}
