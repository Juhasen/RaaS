name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # dir:image-name
          all="booking:booking listing:listing media:media favorites:favorites payment:payment review:review analytics:analytics notification:notification user:user ui:ui gateway:gateway"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=""
          else
            changed="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          fi
          items=()
          for pair in $all; do
            dir="${pair%%:*}"; image="${pair##*:}"
            if [ -z "$changed" ] || echo "$changed" | grep -q "^$dir/"; then
              items+=("{\"dir\":\"$dir\",\"image\":\"$image\"}")
            fi
          done
          matrix="[$(IFS=,; echo "${items[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Tag = short sha of the last commit that touched this service's directory,
      # so unchanged services keep their tag and the deploy script can derive it.
      - id: tag
        run: echo "value=sha-$(git log -1 --format=%H -- '${{ matrix.service.dir }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.dir }}
