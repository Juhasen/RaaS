name: CI payment

on:
  push:
    branches: [main]
    paths:
      - "payment/**"
      - ".github/workflows/ci-payment.yml"
      - ".github/workflows/service.yml"
  pull_request:
    paths:
      - "payment/**"
      - ".github/workflows/ci-payment.yml"
      - ".github/workflows/service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/service.yml
    with:
      dir: payment
      stack: java
